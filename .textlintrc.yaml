# textlint configuration (ADR 0005 "Check Japanese in two stages")
filters:
  comments: true
rules:
  "@asa1984/conceptory/preset-textlint":
    # textlint replaces the preset's options for a rule instead of merging them, so this restates
    # the preset's severity and dictionaryPath.
    ai-words-ja/no-ai-words:
      severity: warning
      dictionaryPath: ./.textlint/vocabulary.json
      # Words used legitimately throughout conceptory's documents.
      allows:
        - 検査
