# Pushes the packages the overlay adds to the binary cache on Cloudflare R2 and deletes old ones
# (ADR 0021 "Serve the packages conceptory's CI builds from a binary cache on Cloudflare R2").
name: binary-cache

on:
  push:
    branches: [main]
  schedule:
    # Every Sunday at 03:00 JST.
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions: {}

# Pushing and garbage collection must not run at the same time, or garbage collection could delete
# a NAR whose narinfo is about to be uploaded.
concurrency:
  group: binary-cache
  cancel-in-progress: false

jobs:
  push:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The environment only allows main, so code under review never gets signed.
    environment: binary-cache
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Install upstream Nix, as development machines use it.
          determinate: false
          diagnostic-endpoint: ""
      # The script needs bash 4 or later, which macOS does not ship.
      - run: nix shell .#awscli2 .#bash --command scripts/binary-cache/push.sh
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BINARY_CACHE_SECRET_KEY: ${{ secrets.BINARY_CACHE_SECRET_KEY }}

  gc:
    # A job whose needs were skipped is skipped too unless its condition says otherwise. Waiting for
    # push keeps a manual run from collecting garbage while pushing.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.push.result != 'failure' }}
    needs: [push]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: binary-cache
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ""
      - run: nix shell .#awscli2 --command scripts/binary-cache/gc.sh
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # Downloads the packages as a downstream repository would, without the R2 credentials. With
  # --max-jobs 0 nothing can be built locally, so a missing or unsigned path fails the build.
  verify:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [push, gc]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          diagnostic-endpoint: ""
          # writeShellApplication disallows substitution because building it is cheap, but the
          # check needs every path to come from a cache.
          extra-conf: |
            substituters = https://cache.nixos.org https://cache.asa1984.dev
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ vars.BINARY_CACHE_PUBLIC_KEY }}
            always-allow-substitutes = true
      - run: nix build --no-link --max-jobs 0 .#conceptory .#ast-grep-rules .#link-ast-grep-rules
