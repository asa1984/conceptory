name: setup-nix
description: Installs Nix with conceptory's binary cache as a substituter.

inputs:
  magic-nix-cache:
    description: Whether to keep the paths the job builds in the GitHub Actions cache for later runs.
    default: "false"
  extra-conf:
    description: Lines to append to nix.conf.
    default: ""

runs:
  using: composite
  steps:
    # The cache's key is written here instead of in a variable because composite actions cannot
    # read variables. Rotating the key means adding the new key here before removing the old one
    # (ADR 0021 "Serve the packages conceptory's CI builds from a binary cache on Cloudflare R2").
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        # Install upstream Nix, as development machines use it.
        determinate: false
        diagnostic-endpoint: ""
        extra-conf: |
          extra-substituters = https://cache.asa1984.dev
          extra-trusted-public-keys = cache.asa1984.dev-2:ZDLpWsB88DIjBav8I3NSSRuBACUgljt7dP2KVkv7IDg=
          ${{ inputs.extra-conf }}
    - if: inputs.magic-nix-cache == 'true'
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-flakehub: false
        diagnostic-endpoint: ""
