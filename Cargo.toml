[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"

[workspace.dependencies]
ammonia = "=4.2.4"
axum = { version = "=0.8.9", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
] }
clap = { version = "=4.6.7", features = ["derive"] }
comrak = { version = "=0.56.0", default-features = false, features = ["shortcodes"] }
conceptory_diagnostic = { path = "crates/conceptory_diagnostic" }
conceptory_files = { path = "crates/conceptory_files" }
conceptory_okf = { path = "crates/conceptory_okf" }
conceptory_server = { path = "crates/conceptory_server" }
globset = "=0.4.20"
http-body-util = "=0.1.5"
ignore = "=0.4.33"
jsonschema = { version = "=0.58.6", default-features = false }
notify-debouncer-full = "=0.7.0"
opener = "=0.9.0"
rust-embed = { version = "=8.13.0", features = ["interpolate-folder-path", "mime-guess"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = "=1.3.0"
tokio = { version = "=1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
tower = { version = "=0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
# Deny all major groups. Allow individual lints by overriding them on top of the priority -1 groups.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# cargo group: whether publishing metadata is needed depends on the project.
cargo_common_metadata = "allow"
# Duplicate versions among third-party crates cannot be controlled.
multiple_crate_versions = "allow"
# Line counts measure formatting rather than complexity; cognitive_complexity measures it instead.
too_many_lines = "allow"

# Lints selected from the restriction group to prevent mistakes.
as_conversions = "deny"     # use From/TryFrom instead of `as` casts
dbg_macro = "deny"
exit = "deny"               # return ExitCode instead of calling std::process::exit
expect_used = "deny"
mod_module_files = "deny"   # put modules in a file named after the directory instead of mod.rs
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"       # disallow eprintln!
print_stdout = "deny"       # disallow println!
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
use_debug = "deny"          # disallow {:?} in user-facing output
